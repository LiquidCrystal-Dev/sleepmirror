<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="logo.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="resultsJS.js" defer></script>
<link rel="stylesheet" href="resultsStyle.css">
<title>Sleep Mirror - Results</title>

</head>
<body>

<br>
<br>
    


<h3 id="welcomeMessage"></h3>
<div id="authLinks">
    <a href="login.html" class="headerbutton1">Log In</a>

    <a href="signup.html" class="headerbutton2">Sign Up</a>
</div>
<button id="logoutButton" onclick="handleLogout()" style="display: none;">Log Out</button>


<h2>Today's Results</h2>  
<h4>Your Distraction Rating:</h4>
<div class="container" id="distractionsDiv"></div> 
<br>

<h4>Your Mental Health Rating:</h4>
<div class="container" id="mentalHealthDiv"></div> 
<br>

<h4>Your Sleep Quality Rating:</h4>
<div class="container" id="sleepQualityDiv"></div>
<br>

<h4>Your Sleep Deficiency Rating:</h4>
<div class="container" id="sleepDeficiencyDiv"></div>
    
    
<br>

<h2>Past Results</h2>

<table id="userResultsTable" style="display: none; margin-top: 20px;">
    <thead>
        <tr>
            <th>Date</th>
            <th>Hours</th>
            <th>Distractions</th>
            <th>Mental Health</th>
            <th>Sleep Quality</th>
            <th>Sleep Deficiency</th>
        </tr>
    </thead>
    <tbody id="resultsTableBody"></tbody>
</table>

<br>

<p>Awaitng graph for visuals.</p>

<br>
</body>
</html>
